<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Lost & Found Matcher</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-box">

        <div class="auth-icon">
            👤
        </div>

        <p class="eyebrow">
            JOIN THE COMMUNITY
        </p>

        <h1>
            Create Account
        </h1>

        <p>
            Create your account to report lost and found items.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="/register"
        >

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 6 characters"
                required
            >


            <button
                type="submit"
                class="btn primary-btn full-btn"
            >
                Create Account
            </button>

        </form>


        <p class="auth-switch">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>


        <a
            href="/"
            class="home-link"
        >
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
